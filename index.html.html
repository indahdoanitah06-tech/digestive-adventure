const A={1:["Rangkaian organ yang mengubah makanan menjadi zat sederhana yang dapat diserap tubuh.","Terdiri atas saluran pencernaan (mulut, faring, esofagus, lambung, usus halus, usus besar, rektum, anus) dan kelenjar pencernaan (kelenjar ludah, hati, pankreas). Prosesnya: pencernaan mekanik, kimiawi, penyerapan, dan pengeluaran sisa.","Nasi yang kamu makan diubah menjadi glukosa agar bisa dipakai sel."],
3:["Karbohidrat: sumber energi utama; protein: pembangun dan perbaikan sel; lemak: cadangan energi dan pelarut vitamin.","Karbohidrat tersusun dari monosakarida, protein dari asam amino, lemak dari gliserol dan asam lemak. Ketiganya dicerna oleh enzim yang berbeda.","Nasi (karbohidrat), tempe (protein), minyak (lemak)."],
4:["Karena mudah diubah menjadi glukosa yang langsung dipakai sel untuk menghasilkan ATP.","Glukosa dioksidasi dalam respirasi sel menjadi ATP. Kelebihannya disimpan sebagai glikogen di hati dan otot.","Sarapan nasi membantu tetap bertenaga saat belajar."],
6:["Lemak diperlukan sebagai cadangan energi, pelarut vitamin A, D, E, K, dan penyusun membran sel.","Lemak juga melindungi organ dan membantu menjaga suhu tubuh. Yang perlu dibatasi adalah jumlah berlebih, terutama lemak jenuh.","Alpukat dan ikan menyediakan lemak tak jenuh."],
15:["Gerakan kontraksi otot polos bergelombang yang mendorong makanan di sepanjang saluran pencernaan.","Otot melingkar dan memanjang berkontraksi bergantian sehingga bolus terdorong ke depan.","Seperti meremas tabung pasta gigi dari ujung ke ujung.","Karena peristaltik, kita tetap bisa menelan meski posisi tubuh terbalik."],
17:["Untuk memperluas permukaan penyerapan zat makanan.","Dinding usus halus berlipat, memiliki vili, dan sel vili memiliki mikrovili. Di dalam vili ada kapiler darah dan pembuluh limfa yang mengangkut hasil pencernaan.","Seperti handuk berbulu yang menyerap lebih banyak air daripada kain licin."],
18:["Menghasilkan empedu, menetralkan racun, serta mengolah dan menyimpan zat gizi.","Empedu membantu pencernaan lemak. Hati juga menerima darah dari usus yang membawa hasil serapan dan menyimpan kelebihan glukosa sebagai glikogen.","Zat sisa obat diolah di hati."],
23:["Dindingnya dilindungi lapisan mukus.","Mukus melapisi permukaan lambung sehingga HCl dan pepsin tidak merusak dinding; sel dindingnya juga cepat diperbarui. Pepsin dikeluarkan sebagai pepsinogen yang baru aktif di rongga lambung.","Seperti lapisan pelindung pada wadah yang diisi asam."],
24:["Bisa, karena gerak peristaltik esofagus mendorong makanan, bukan hanya gravitasi.","Otot esofagus berkontraksi bergelombang mendorong bolus menuju lambung.","Astronaut tetap dapat makan dan minum di lingkungan tanpa bobot."],
33:["Menguraikan amilum (pati) menjadi maltosa.","Dihasilkan kelenjar ludah (ptialin) dan pankreas; bekerja di mulut dan usus halus. Maltosa kemudian diuraikan maltase menjadi glukosa.","Nasi yang dikunyah lama terasa manis."],
34:["Menguraikan protein menjadi pepton.","Dikeluarkan sebagai pepsinogen, diaktifkan HCl, dan bekerja pada suasana asam di lambung. Pepton dicerna lebih lanjut oleh tripsin di usus halus.","Daging yang kita makan mulai dicerna di lambung."],
35:["Menguraikan lemak menjadi asam lemak dan gliserol.","Empedu lebih dulu mengemulsi lemak menjadi butiran kecil sehingga permukaannya luas bagi lipase pankreas dan usus halus.","Minyak pada makanan dicerna di usus halus."],
43:["Iodin dalam Lugol membentuk kompleks dengan amilum sehingga berwarna biru kehitaman.","Iodin terselip dalam struktur heliks amilosa pada pati. Tanpa amilum warna tetap cokelat kekuningan.","Nasi, kentang, dan singkong memberi hasil positif."],
45:["Reaksi gula pereduksi dengan reagen Benedict berlangsung dengan pemanasan.","Gula pereduksi mereduksi ion Cu²⁺ (biru) menjadi endapan Cu₂O yang berwarna hijau sampai merah bata. Tanpa pemanasan hasil bisa tampak negatif padahal ada gula.","Warna makin ke merah bata berarti gula pereduksi makin banyak."],
46:["Ikatan peptida protein membentuk kompleks ungu dengan ion tembaga dalam suasana basa.","Makin banyak ikatan peptida, warna ungu makin pekat. Larutan tanpa protein tetap biru.","Putih telur dan tahu memberi hasil positif."],
47:["Lemak meninggalkan noda transparan yang menetap pada kertas.","Lemak membuat serat kertas tembus cahaya. Air juga membuat kertas transparan sementara, tetapi menguap dan hilang, sedangkan noda lemak tetap.","Noda minyak pada kertas bungkus gorengan."],
51:["Umumnya infeksi kuman atau virus, makanan atau minuman tercemar, atau intoleransi makanan tertentu.","Gerak usus menjadi cepat dan penyerapan air berkurang sehingga feses cair dan risiko dehidrasi meningkat. Ini informasi umum, bukan diagnosis; bila berat atau lama, periksakan ke tenaga kesehatan.","Jajan tanpa mencuci tangan lebih dulu."],
52:["Umumnya karena kurang serat dan air, kurang bergerak, atau sering menahan buang air besar.","Feses terlalu lama di usus besar sehingga banyak air terserap dan menjadi keras.","Jarang makan sayur dan buah, jarang minum air."],
61:["Amilase dalam air liur menguraikan amilum nasi menjadi maltosa yang terasa manis.","Semakin lama dikunyah, semakin banyak amilum yang terurai menjadi maltosa.","Coba kunyah sesuap nasi 1 sampai 2 menit tanpa menelan."],
64:["Empedu mengemulsi lemak menjadi butiran kecil sehingga mudah dicerna lipase.","Empedu dibuat hati, disimpan di kantung empedu, dan dialirkan ke duodenum. Ia mengandung garam empedu, bukan enzim.","Seperti sabun yang memecah minyak menjadi butiran halus."],
66:["Karena sangat panjang dan permukaannya diperluas oleh lipatan, vili, dan mikrovili.","Pencernaan kimiawi di sini selesai, lalu hasilnya diserap ke kapiler darah (glukosa, asam amino) dan pembuluh limfa (asam lemak dan gliserol).","Seperti jalan tol yang punya banyak gerbang masuk."]};
const KB=[[["lambung","hcl","pepsin","renin","gastrin"],"LAMBUNG: tempat makanan ditampung dan diaduk (pencernaan mekanik) lalu dicerna kimiawi. Bagian: kardiak, fundus, pilorus. HCl membunuh kuman dan mengaktifkan pepsinogen menjadi pepsin yang menguraikan protein menjadi pepton; renin menggumpalkan kasein susu; gastrin merangsang getah lambung. Mukus melindungi dinding lambung. Hasilnya berupa bubur kimus."],
[["amilase","ptialin","pati","amilum"],"AMILASE: enzim yang menguraikan amilum (pati) menjadi maltosa. Dihasilkan kelenjar ludah (ptialin) dan pankreas; bekerja di mulut dan usus halus. Maltosa lalu diuraikan maltase menjadi glukosa. Contoh: nasi yang dikunyah lama terasa manis."],
[["usus halus","vili","mikrovili","penyerapan","menyerap","serap"],"USUS HALUS (duodenum, jejunum, ileum): tempat pencernaan akhir dan penyerapan utama. Permukaannya sangat luas karena lipatan, vili, dan mikrovili; di dalam vili ada kapiler darah dan pembuluh limfa. Glukosa dan asam amino masuk ke darah; asam lemak dan gliserol masuk ke limfa."],
[["peristaltik","menelan","esofagus","kerongkongan"],"PERISTALTIK: gerakan kontraksi otot polos bergelombang yang mendorong makanan sepanjang saluran pencernaan, termasuk di esofagus (kerongkongan). Karena itu kita tetap bisa menelan meski posisi tubuh terbalik. Saat menelan, epiglotis menutup trakea agar makanan tidak masuk saluran napas."],
[["mulut","gigi","ludah","lidah","kunyah"],"MULUT: pencernaan mekanik oleh gigi (insisivus memotong, kaninus merobek, premolar dan molar menggiling) dan lidah yang mengaduk. Kelenjar ludah (parotis, submandibularis, sublingualis) menghasilkan air liur berisi amilase yang memulai pencernaan amilum."],
[["usus besar","feses","kolon","rektum","anus"],"USUS BESAR: menyerap air dan elektrolit dari sisa makanan, membentuk feses dengan bantuan bakteri usus, menyimpannya sementara di rektum, lalu dikeluarkan lewat anus."],
[["hati","empedu","kantung empedu"],"HATI dan EMPEDU: hati menghasilkan empedu, menetralkan racun, dan menyimpan glikogen. Empedu disimpan di kantung empedu, mengemulsi lemak (bukan enzim) sehingga mudah dicerna lipase."],
[["pankreas","tripsin","insulin"],"PANKREAS: menghasilkan getah pankreas ke duodenum (amilase, tripsin, lipase, dan natrium bikarbonat penetral asam) serta hormon insulin dan glukagon yang mengatur gula darah."],
[["enzim","substrat","suhu","spesifik"],"ENZIM: protein pengatur reaksi kimia pencernaan. Bekerja spesifik pada substrat tertentu, paling aktif pada suhu dan pH optimal (pepsin pada asam, enzim usus pada suasana basa lemah). Suhu atau pH ekstrem merusak enzim. Contoh: amilase pada amilum, pepsin dan tripsin pada protein, lipase pada lemak."],
[["lipase","lemak"],"LEMAK: dicerna menjadi asam lemak dan gliserol oleh lipase (pankreas dan usus halus) setelah diemulsi empedu. Lemak berfungsi sebagai cadangan energi dan pelarut vitamin A, D, E, K."],
[["karbohidrat","protein","glukosa","asam amino","zat makanan"],"ZAT MAKANAN: karbohidrat (sumber energi, menjadi glukosa), protein (pembangun sel, menjadi asam amino), lemak (cadangan energi), vitamin dan mineral (pengatur), serta air dan serat."],
[["serat","sembelit","konstipasi"],"SERAT: tidak dicerna tetapi menambah massa feses dan melancarkan buang air besar. Kurang serat dan air dapat memicu sembelit. Sumber: sayur, buah, dan biji-bijian."],
[["diare","gastritis","maag","apendisitis","keracunan","karies","sariawan","cacing","tukak"],"GANGGUAN PENCERNAAN (diare, gastritis, sembelit, karies gigi, sariawan, apendisitis, keracunan makanan, cacingan) umumnya terkait kebersihan, pola makan, atau infeksi. Pencegahan: cuci tangan, makan teratur, cukup serat dan air, makanan bersih. Ini informasi umum, bukan diagnosis; bila gejala berat, periksa ke tenaga kesehatan."],
[["lugol","benedict","biuret","uji zat","praktikum"],"UJI ZAT MAKANAN: Lugol untuk amilum (biru kehitaman), Benedict untuk gula pereduksi (dipanaskan; biru, hijau, kuning, jingga, merah bata), Biuret untuk protein (ungu), kertas buram atau emulsi etanol untuk lemak."],
[["berbunyi","keroncongan"],"PERUT BERBUNYI: gerakan otot saluran cerna mendorong campuran gas dan cairan sehingga timbul bunyi (borborigmi). Bunyi terdengar lebih jelas saat lambung kosong karena tidak teredam isi makanan."]];
KB.unshift([["perbedaan amilase","amilase dan pepsin","amilase pepsin","amilase, pepsin"],"PERBEDAAN: AMILASE menguraikan amilum menjadi maltosa (mulut dan usus halus, suasana netral sampai basa lemah). PEPSIN menguraikan protein menjadi pepton (lambung, suasana asam karena HCl). LIPASE menguraikan lemak menjadi asam lemak dan gliserol (usus halus, setelah lemak diemulsi empedu). Tiap enzim spesifik pada satu jenis substrat."]);
